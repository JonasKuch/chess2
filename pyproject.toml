[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chess2"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "chess",
    "joblib",
    "numpy",
    "pillow",
    "pygame",
    "stockfish",
    "torch",
]

[project.scripts]
chess2 = "chess2.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess2 = ["bot/weights/*.pth", "gui/fonts/*.ttf", "gui/pieces_img/*.png"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# joblib warns about a NumPy 2.5 deprecation while loading the test fixture
filterwarnings = ["ignore::DeprecationWarning:joblib.*"]
